server {
    server_name familychronica.com www.familychronica.com;

    root /var/www/familychronica/current;
    index index.html;
    location = / { return 301 /en/; }
    include /etc/nginx/snippets/familychronica-auth.conf;

    location = /tickets { return 302 /tickets/; }
    location ^~ /tickets/ {
        proxy_pass http://127.0.0.1:3130/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    location / {
        try_files $uri/index.html $uri $uri/ /index.html;
    }

    location ~* \.(?:mp4|webm|vtt)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Accept-Ranges "bytes" always;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|svg|ico|webp|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/familychronica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/familychronica.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.familychronica.com) {
        return 301 https://$host$request_uri;
    }

    if ($host = familychronica.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name familychronica.com www.familychronica.com;
    return 404;
}
